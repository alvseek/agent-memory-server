[project]
name = "munnin"
version = "0.1.0"
description = "Munnin — the agent-memory MCP server (owns Valaskjalf/memory)."
readme = "README.md"
authors = [
    { name = "Alviandi Widiasto", email = "alviandi@msn.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.6",
    "uvicorn>=0.52.1",
]

[project.scripts]
munnin = "munnin.__main__:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The control-files submodule owns and runs its own tool tests (its own pyproject);
# Munnin no longer collects them here.
testpaths = ["tests"]
