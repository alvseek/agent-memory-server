# The LOCAL shape: one container, local mode, reachable from this machine only.
# The hosted shape does not use this file — it runs the same image in token mode
# behind a TLS proxy, configured by whatever deploys it (docs/README.md,
# "How Is It Deployed").
name: munnin

services:
  munnin:
    build:
      context: .
      dockerfile: Dockerfile
    image: munnin:0.1.0
    # Published on the host's loopback only. Local mode is safe precisely because
    # nothing beyond this machine can reach the port, and MUNNIN_LOCAL_BIND_ALL
    # below is the statement of this line. The HOST port is a choice (a host-native
    # Munnin may already hold 8200); the container port is fixed.
    ports:
      - "127.0.0.1:${MUNNIN_HOST_PORT:-8200}:8200"
    environment:
      # 0.0.0.0 inside the container: the app's own default of 127.0.0.1 binds
      # the container's loopback, which nothing outside it can reach.
      MUNNIN_HOST: "0.0.0.0"
      MUNNIN_PORT: "8200"
      MUNNIN_USER_ID: "${MUNNIN_USER_ID:-alvi}"
      MUNNIN_DB_PATH: /app/data/valaskjalf-memory.db
      MUNNIN_CONTENT_ROOT: /app/control-files
      # Local mode: no identity provider, every call acts as MUNNIN_USER_ID. The app
      # enforces the "this machine only" half itself — it refuses to start with
      # MUNNIN_AUTH=off whenever MUNNIN_PUBLIC_BASE_URL is not a loopback address.
      # To run this image behind a public hostname instead, drop MUNNIN_AUTH and
      # MUNNIN_LOCAL_BIND_ALL and set MUNNIN_LOGTO_ENDPOINT plus the real public URL.
      MUNNIN_AUTH: "off"
      MUNNIN_PUBLIC_BASE_URL: "http://127.0.0.1:${MUNNIN_HOST_PORT:-8200}"
      # The container binds 0.0.0.0 (it must, to be reachable from the host at all),
      # which local mode refuses unless told that something else keeps it local. The
      # `ports:` line above is that something, and this flag is the acknowledgement
      # of it — never a detection. Do not set it on a process that binds 0.0.0.0
      # without such a front.
      MUNNIN_LOCAL_BIND_ALL: "1"
    volumes:
      # The DIRECTORY, never the file. SQLite runs in WAL mode here, so it keeps
      # -wal and -shm sidecars beside the database; mounting only the .db would
      # strand them in the container and destroy them on recreation.
      - type: volume
        source: munnin-data
        target: /app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  munnin-data:
    # Named, never anonymous — an anonymous volume dies with the container.
    # Local only: POSIX advisory locking is unreliable over NFS/CIFS, which
    # makes a network driver under a file database a corruption path.
    driver: local
