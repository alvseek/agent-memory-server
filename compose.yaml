name: munnin

services:
  munnin:
    build:
      context: .
      dockerfile: Dockerfile
    image: munnin:0.1.0
    # Loopback only. A reverse proxy on the host is the intended public face,
    # so this must not land on every interface. The HOST port is deployment
    # config (the host-native Munnin may already hold 8200); the container
    # port is fixed.
    ports:
      - "127.0.0.1:${MUNNIN_HOST_PORT:-8200}:8200"
    environment:
      # 0.0.0.0 inside the container: the app's own default of 127.0.0.1 binds
      # the container's loopback, which nothing outside it can reach.
      MUNNIN_HOST: "0.0.0.0"
      MUNNIN_PORT: "8200"
      MUNNIN_USER_ID: "${MUNNIN_USER_ID:-alvi}"
      MUNNIN_DB_PATH: /app/data/valaskjalf-memory.db
      MUNNIN_CONTENT_ROOT: /app/control-files
      # Local mode: no identity provider, every call acts as MUNNIN_USER_ID. Safe only
      # because the port above is published on the host's loopback — and the app
      # enforces that from its own side: it refuses to start with MUNNIN_AUTH=off
      # whenever MUNNIN_PUBLIC_BASE_URL is not a loopback address. To run this image
      # behind a public hostname instead, drop both lines and configure an issuer
      # (MUNNIN_LOGTO_ENDPOINT) plus the public URL, as the hosted deploy does.
      MUNNIN_AUTH: "off"
      MUNNIN_PUBLIC_BASE_URL: "http://127.0.0.1:${MUNNIN_HOST_PORT:-8200}"
      # The container binds 0.0.0.0 (it must, to be reachable from the host at all),
      # which local mode refuses unless told that something else keeps it local. The
      # `ports:` line above is that something — the port is published on the host's
      # loopback only — and this flag is the statement of it. Never set this flag on
      # a process that binds 0.0.0.0 without such a front.
      MUNNIN_LOCAL_BIND_ALL: "1"
    volumes:
      # The DIRECTORY, never the file. SQLite runs in WAL mode here, so it keeps
      # -wal and -shm sidecars beside the database; mounting only the .db would
      # strand them in the container and destroy them on recreation.
      - type: volume
        source: munnin-data
        target: /app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  munnin-data:
    # Named, never anonymous — an anonymous volume dies with the container.
    # Local only: POSIX advisory locking is unreliable over NFS/CIFS, which
    # makes a network driver under a file database a corruption path.
    driver: local
